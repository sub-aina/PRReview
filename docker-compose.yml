version: '3.9'
services:
  prreviewer:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env                      # loads GITHUB_TOKEN, GROQ_API_KEY, etc.
    volumes:
      - chroma_data:/app/chroma_db  # ChromaDB persists across restarts
    restart: unless-stopped

volumes:
  chroma_data: